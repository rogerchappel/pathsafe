name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - test/**
      - tsconfig.json
      - scripts/**
      - examples/**
      - demo/**
      - docs/**
      - README.md
      - LICENSE
      - SECURITY.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - CODE_OF_CONDUCT.md
      - ROADMAP.md
      - package.json
      - package-lock.json
      - releasebox.config.json
      - .github/workflows/release*.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Run release checks
        run: npm run release:check
      - name: Stage release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json)"
          artifact_name="$(node -e 'const result = JSON.parse(process.argv[1]); if (result.length !== 1 || typeof result[0].filename !== "string") process.exit(1); process.stdout.write(result[0].filename)' "$pack_json")"
          case "$artifact_name" in
            *.tgz) ;;
            *) echo "npm pack returned an unexpected artifact: $artifact_name" >&2; exit 1 ;;
          esac
          artifact_path="$PWD/$artifact_name"
          test -f "$artifact_path"
          tar -tzf "$artifact_path" >/dev/null
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
      - name: Release notes preview
        run: |
          node /tmp/releasebox/bin/releasebox.js notes . > release-notes-preview.md
          cat release-notes-preview.md
      - name: Publish release notes summary
        run: cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
